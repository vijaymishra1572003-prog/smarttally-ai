{% extends "base.html" %}
{% block title %}Forgot Password - SmartTally AI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="hero-blob blob-1"></div>
    <div class="hero-blob blob-2"></div>
    <div class="auth-card">
        <div class="text-center mb-4">
            <div style="width:56px;height:56px;background:linear-gradient(135deg,#F59E0B,#D97706);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
                <i class="bi bi-key text-white fs-4"></i>
            </div>
            <h3 class="fw-bold">Forgot Password</h3>
            <p class="text-muted">Enter your email to receive a reset OTP</p>
        </div>

        <div id="step1">
            <form id="forgotForm">
                <div class="mb-4">
                    <label class="form-label fw-medium">Email Address</label>
                    <input type="email" class="form-input" id="forgotEmail" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary-gradient w-100 py-3 mb-3">
                    <i class="bi bi-send me-2"></i>Send OTP
                </button>
            </form>
        </div>

        <div id="step2" class="d-none">
            <form id="resetForm">
                <div class="mb-3">
                    <label class="form-label fw-medium">OTP</label>
                    <input type="text" class="form-input text-center" id="resetOtp" placeholder="Enter 6-digit OTP" maxlength="6" required style="font-size:1.5rem;letter-spacing:8px">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium">New Password</label>
                    <input type="password" class="form-input" id="newPassword" placeholder="Min. 8 characters" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary-gradient w-100 py-3 mb-3">
                    <i class="bi bi-check-circle me-2"></i>Reset Password
                </button>
            </form>
        </div>

        <div id="forgotMsg" class="alert d-none mt-3"></div>

        <div class="text-center mt-4">
            <a href="/login" class="text-primary fw-semibold text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let userEmail = '';

document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    userEmail = document.getElementById('forgotEmail').value;
    const msgDiv = document.getElementById('forgotMsg');

    try {
        const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: userEmail})
        });
        const data = await res.json();
        msgDiv.classList.remove('d-none', 'alert-danger');
        msgDiv.classList.add('alert-success');
        msgDiv.textContent = data.otp ? `Your OTP: ${data.otp}` : data.message;
        document.getElementById('step1').classList.add('d-none');
        document.getElementById('step2').classList.remove('d-none');
    } catch (err) {
        msgDiv.classList.remove('d-none', 'alert-success');
        msgDiv.classList.add('alert-danger');
        msgDiv.textContent = 'Connection error';
    }
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msgDiv = document.getElementById('forgotMsg');

    try {
        const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email: userEmail,
                otp: document.getElementById('resetOtp').value,
                new_password: document.getElementById('newPassword').value
            })
        });
        const data = await res.json();
        if (res.ok) {
            msgDiv.classList.remove('d-none', 'alert-danger');
            msgDiv.classList.add('alert-success');
            msgDiv.textContent = 'Password reset successful! Redirecting to login...';
            setTimeout(() => window.location.href = '/login', 2000);
        } else {
            msgDiv.classList.remove('d-none', 'alert-success');
            msgDiv.classList.add('alert-danger');
            msgDiv.textContent = data.error;
        }
    } catch (err) {
        msgDiv.classList.remove('d-none', 'alert-success');
        msgDiv.classList.add('alert-danger');
        msgDiv.textContent = 'Connection error';
    }
});
</script>
{% endblock %}
