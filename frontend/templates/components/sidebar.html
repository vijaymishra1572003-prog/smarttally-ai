<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="p-4 mb-2">
        <div class="d-flex align-items-center">
            <div style="width:40px;height:40px;background:linear-gradient(135deg,#818CF8,#A78BFA);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-right:10px">
                <i class="bi bi-robot text-white"></i>
            </div>
            <span class="text-white fw-bold fs-5">SmartTally AI</span>
        </div>
    </div>
    <div class="px-3">
        <small class="text-white-50 px-3 text-uppercase" style="font-size:0.7rem;letter-spacing:1px">Main Menu</small>
    </div>
    <nav class="mt-2">
        <a href="/dashboard" class="sidebar-link {% if active == 'dashboard' %}active{% endif %}">
            <i class="bi bi-grid-1x2 me-3"></i> Dashboard
        </a>
        <a href="/dashboard/processing" class="sidebar-link {% if active == 'processing' %}active{% endif %}">
            <i class="bi bi-cpu me-3"></i> AI Processing
        </a>
        <a href="/dashboard/gst" class="sidebar-link {% if active == 'gst' %}active{% endif %}">
            <i class="bi bi-percent me-3"></i> GST Module
        </a>
        <a href="/dashboard/tally" class="sidebar-link {% if active == 'tally' %}active{% endif %}">
            <i class="bi bi-link-45deg me-3"></i> Tally Integration
        </a>
        <a href="/dashboard/users" class="sidebar-link {% if active == 'users' %}active{% endif %}">
            <i class="bi bi-people me-3"></i> User Management
        </a>

        <div class="px-3 mt-4">
            <small class="text-white-50 px-3 text-uppercase" style="font-size:0.7rem;letter-spacing:1px">Tools</small>
        </div>
        <a href="#" class="sidebar-link" onclick="openChatbot()">
            <i class="bi bi-chat-dots me-3"></i> AI Chatbot
        </a>
        <a href="#" class="sidebar-link" onclick="exportData('csv')">
            <i class="bi bi-download me-3"></i> Export Data
        </a>
    </nav>

    <div class="position-absolute bottom-0 w-100 p-3">
        <div class="glass-card p-3" style="background:rgba(255,255,255,0.05)">
            <div class="d-flex align-items-center">
                <div style="width:36px;height:36px;background:var(--gradient-2);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;margin-right:10px;font-size:0.85rem" id="userAvatar">AD</div>
                <div class="flex-grow-1">
                    <small class="text-white d-block fw-medium" id="userName">Admin</small>
                    <small class="text-white-50" id="userRole">Super Admin</small>
                </div>
                <button class="btn btn-sm text-white-50" onclick="logout()"><i class="bi bi-box-arrow-right"></i></button>
            </div>
        </div>
    </div>
</div>

<!-- Mobile Toggle -->
<button class="btn btn-primary d-lg-none position-fixed" style="top:10px;left:10px;z-index:200;border-radius:10px" onclick="document.getElementById('sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

<!-- Chatbot Modal -->
<div class="modal fade" id="chatbotModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius:20px;border:none">
            <div class="modal-header border-0 pb-0" style="background:var(--gradient-2);border-radius:20px 20px 0 0;padding:24px">
                <h5 class="modal-title text-white fw-bold"><i class="bi bi-chat-dots me-2"></i>AI Assistant</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="max-height:400px;overflow-y:auto;padding:24px" id="chatMessages">
                <div class="mb-3">
                    <div class="d-flex gap-2">
                        <div style="width:32px;height:32px;background:var(--gradient-2);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                            <i class="bi bi-robot text-white" style="font-size:14px"></i>
                        </div>
                        <div class="p-3 rounded-3" style="background:#F1F5F9;max-width:80%">
                            <small>Hi! I'm your AI accounting assistant. Try asking:<br>
                            - "Show March GST report"<br>
                            - "Generate purchase summary"<br>
                            - "Show pending invoices"</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <div class="input-group">
                    <input type="text" class="form-control rounded-start-3" id="chatInput" placeholder="Ask something..." style="border:2px solid #E5E7EB">
                    <button class="btn btn-primary-gradient rounded-end-3" onclick="sendChat()"><i class="bi bi-send"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>
